<!-- Desktop Theme & Dark Mode Controls -->
<div class="hidden md:flex md:items-center md:gap-2">
  <label for="desktop-theme-select" class="sr-only">Theme</label>
  <select
    id="desktop-theme-select"
    [value]="themeService.theme()"
    (change)="onThemeSelect($event)"
    class="rounded-lg border border-edge bg-surface-elevated px-2.5 py-1.5 text-sm font-medium text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
  >
    @for (option of themeService.themes; track option.id) {
      <option [value]="option.id">{{ option.label }}</option>
    }
  </select>

  <button
    type="button"
    (click)="themeService.toggleMode()"
    [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    class="flex items-center gap-1.5 rounded-lg border border-edge bg-surface-elevated px-2.5 py-1.5 text-sm font-medium text-ink transition-colors hover:border-accent hover:text-accent-bright focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
  >
    <span class="material-symbols-outlined text-lg" aria-hidden="true">
      {{ themeService.isDark() ? 'dark_mode' : 'light_mode' }}
    </span>
    <span>{{ themeService.isDark() ? 'Dark' : 'Light' }}</span>
  </button>
</div>

<!-- Mobile Theme & Dark Mode Dropdown -->
<div class="md:hidden">
  <button
    type="button"
    popovertarget="mobile-theme-menu"
    popovertargetaction="toggle"
    aria-controls="mobile-theme-menu"
    aria-label="Theme and color mode"
    class="theme-trigger flex items-center gap-1.5 rounded-lg border border-edge bg-surface-elevated px-2.5 py-1.5 text-sm font-medium text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
  >
    <span class="material-symbols-outlined text-lg" aria-hidden="true">palette</span>
    <span>Theme</span>
  </button>

  <div
    id="mobile-theme-menu"
    popover="auto"
    class="theme-popover space-y-3 rounded-xl border border-edge bg-surface p-3 shadow-xl"
  >
    <div class="space-y-1">
      <label for="mobile-theme-select" class="block text-xs font-medium text-ink-muted">
        Theme
      </label>
      <select
        id="mobile-theme-select"
        [value]="themeService.theme()"
        (change)="onThemeSelect($event)"
        class="w-full rounded-lg border border-edge bg-surface-elevated px-2.5 py-1.5 text-sm font-medium text-ink"
      >
        @for (option of themeService.themes; track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="space-y-1">
      <span class="block text-xs font-medium text-ink-muted">Color Mode</span>
      <button
        type="button"
        (click)="themeService.toggleMode()"
        class="flex w-full items-center justify-between rounded-lg border border-edge bg-surface-elevated px-2.5 py-1.5 text-sm font-medium text-ink hover:border-accent"
      >
        <span>{{ themeService.isDark() ? 'Dark Mode' : 'Light Mode' }}</span>
        <span class="material-symbols-outlined text-lg" aria-hidden="true">
          {{ themeService.isDark() ? 'dark_mode' : 'light_mode' }}
        </span>
      </button>
    </div>
  </div>
</div>
