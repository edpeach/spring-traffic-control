<article class="rounded-xl border border-edge bg-surface-elevated p-3 text-ink shadow-sm">
  <header class="mb-2 flex items-center justify-between gap-2 border-b border-edge pb-2">
    <div class="flex items-center gap-1.5">
      <mat-icon class="text-base text-accent-bright" aria-hidden="true">near_me</mat-icon>
      <h3 class="text-xs font-semibold uppercase tracking-wide text-ink">
        {{ emergencyOnly() ? 'Closest Emergency Airports' : 'Closest Airports' }}
      </h3>
    </div>

    @if (icao24(); as hex) {
      <span class="rounded bg-canvas px-1.5 py-0.5 font-mono text-[10px] text-ink-muted">
        {{ hex.toUpperCase() }}
      </span>
    }
  </header>

  @if (airports().length === 0) {
    <p class="text-xs text-ink-muted">No nearby airports found.</p>
  } @else {
    <ul class="flex flex-col gap-1.5">
      @for (item of airports(); track item.station.id; let idx = $index) {
        <li>
          <button
            type="button"
            (click)="selectStation.emit(item.station)"
            class="flex w-full items-center justify-between gap-2 rounded-lg border border-edge/70 bg-surface px-2.5 py-2 text-left transition-colors hover:border-accent hover:bg-canvas"
          >
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-semibold text-accent-bright">{{ idx + 1 }}.</span>
                <span class="truncate text-xs font-semibold text-ink">{{ item.station.name }}</span>
              </div>
              <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-[11px] text-ink-muted">
                <span class="font-mono font-medium text-ink">{{ routeCode(item.station) }}</span>
                @if (item.station.iata && item.station.icao) {
                  <span>({{ item.station.iata }})</span>
                }
                <span>·</span>
                <span>{{ item.station.maxAircraftCategory }}</span>
                @if (item.station.emergencyMedicalCapable) {
                  <span
                    class="rounded bg-accent/15 px-1 text-[10px] font-medium text-accent-bright"
                  >
                    MED
                  </span>
                }
              </div>
            </div>

            <span class="shrink-0 font-mono text-xs font-semibold text-accent-bright">
              {{ item.distanceKm.toFixed(1) }} km
            </span>
          </button>
        </li>
      }
    </ul>
  }
</article>
